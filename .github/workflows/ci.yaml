name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  macos-cli-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-macos
          repository-cache: true

      - name: Run macOS CLI from a consumer workspace
        working-directory: examples/simple
        run: bazel run @rules_formatjs//cli -- --version

      - name: Smoke test extraction and compilation
        run: bazel test //tests/arguments:test_fixtures_0_test //tests/arguments:test_fixtures_1_test

  linux-arm64-smoke:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-linux-arm64
          repository-cache: true

      - name: Run Linux ARM64 CLI
        run: |
          bazel run @rules_formatjs//cli -- --version

      - name: Smoke test Linux ARM64 CLI
        run: |
          bazel test //tests/arguments:test_fixtures_0_test

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-ubuntu-24.04-arm
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: warn
          retention-days: 7

  windows-cli-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows
          repository-cache: true

      - name: Run Windows CLI
        working-directory: examples/simple
        shell: bash
        run: bazel run "@rules_formatjs//cli" -- --version

      - name: Extract messages from a large source list
        shell: bash
        run: bazel test //tests/arguments:large_source_list_test

  ci:
    if: always()
    needs: [macos-cli-smoke, linux-arm64-smoke, windows-cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native smoke test
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
